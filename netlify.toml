# Static site — no build step. Netlify serves the repo root as-is.
[build]
  publish = "."

# Sensible defaults for a public marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Review-mode X-Robots-Tag removed — the site is now indexable.
    #
    # Every canonical, og:url and sitemap entry points at
    # https://www.primewires.in/. Until that domain serves this site,
    # a crawler reaching the netlify.app preview is told the real page
    # lives somewhere that does not answer, so nothing gets indexed
    # either way. Point the domain here to make this line's removal count.

# Photography is stable — cache it hard. CSS/JS deliberately excluded, so an
# edit to site.css reaches returning visitors on their next request.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
